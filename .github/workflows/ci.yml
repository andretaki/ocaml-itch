name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        ocaml-compiler: ["5.2", "5.3"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest

  # flambda is the fair vanilla baseline for the benchmark, and it optimises
  # differently enough to have caught a compiler-dependent expect test before.
  flambda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OCaml 5.2 with flambda
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ocaml-variants.5.2.0+options,ocaml-option-flambda

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest

  # Three implementations, one aggregate.
  #
  # The C++ and the Python each transcribe the ITCH offsets by hand from the
  # specification, so a wrong offset in lib/itch/wire.ml disagrees with two
  # independent readings rather than with none. This is the only check in the
  # project that can catch a *shared misreading* of the spec: the round-trip
  # property test cannot, because the encoder and the decoder would misread it
  # identically and the round trip would still close. Measured -- swapping the
  # two order-reference offsets in wire.ml and encoder.ml together leaves the
  # round trip, the differential test, the order book and the allocation test
  # all green, and both of the implementations here catch it.
  #
  # The book is checked the same way and separately, because it is the only
  # stateful part: a modify carries an order reference and nothing else, so both
  # implementations have to remember every live order, carry side and symbol
  # forward across a replace, and tell "subtract these shares" from "this is the
  # new total". Those produce plausible, wrong books, and no per-message check
  # can see them.
  #
  # This does not time anything: a shared runner cannot produce a benchmark
  # worth reporting. It checks agreement, which is what makes the timings taken
  # on a quiet machine mean something.
  cross-implementation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      - name: Build C++ baseline
        run: g++ -O3 -std=c++20 -o bench/cpp/baseline bench/cpp/baseline.cpp

      - name: Generate a corpus and compare all three aggregates
        run: |
          set -euo pipefail
          opam exec -- ./_build/default/test/gen_corpus.exe /tmp/corpus.itch50 20000
          opam exec -- ./_build/default/bin/itch.exe checksum /tmp/corpus.itch50 | head -2 > /tmp/ml.txt
          ./bench/cpp/baseline /tmp/corpus.itch50 1 | head -2 > /tmp/cpp.txt
          echo "OCaml: $(head -1 /tmp/ml.txt)"
          echo "C++  : $(head -1 /tmp/cpp.txt)"
          diff /tmp/ml.txt /tmp/cpp.txt
          python3 test/cross_check.py checksum /tmp/corpus.itch50 --expect /tmp/ml.txt

      # An agreement check that has never been seen to disagree is not evidence
      # that it can. Perturb one offset and require the Python to notice, in the
      # job that relies on it noticing.
      - name: Prove the cross-check can fail
        run: |
          set -euo pipefail
          cp test/cross_check.py /tmp/cross_check.orig
          sed -i 's|a\.sum_prices += price|a.sum_prices += price + 1|' test/cross_check.py
          if python3 test/cross_check.py checksum /tmp/corpus.itch50 --expect /tmp/ml.txt; then
            cp /tmp/cross_check.orig test/cross_check.py
            echo "FAIL: the cross-check agreed with a deliberately wrong implementation"
            exit 1
          fi
          cp /tmp/cross_check.orig test/cross_check.py
          echo "OK: the cross-check reported the injected divergence"

      # A message whose type byte names a decoded type but whose framed length
      # is too short to hold that type's fields. Reading its header anyway runs
      # off the end of the message, and off the end of the mapping when it is
      # the last message in a page-aligned file. Every implementation here has
      # had that bug: the OCaml read the header before the type was known, then
      # read it before check_length ran, and the C++ did both until it was given
      # a check_length at all. All three must refuse the file.
      - name: A message too short for its type must be refused by all three
        run: |
          set -euo pipefail
          opam exec -- ./_build/default/test/gen_corpus.exe -malformed /tmp/malformed.itch50
          fail=0
          if opam exec -- ./_build/default/bin/itch.exe checksum /tmp/malformed.itch50 >/dev/null 2>&1; then
            echo "FAIL: the OCaml accepted a truncated Add Order"; fail=1
          fi
          if ./bench/cpp/baseline /tmp/malformed.itch50 1 >/dev/null 2>&1; then
            echo "FAIL: the C++ baseline accepted a truncated Add Order"; fail=1
          fi
          if python3 test/cross_check.py checksum /tmp/malformed.itch50 >/dev/null 2>&1; then
            echo "FAIL: the Python cross-check accepted a truncated Add Order"; fail=1
          fi
          exit $fail

      # The aggregate corpus is drawn from the round-trip generators, whose
      # order references are random -- so almost every modify is an orphan and
      # the book it produces is not a plausible order flow. -book keeps the same
      # model the book keeps, so every modify names a live order and no execution
      # takes more shares than the order has left. `itch book` exits non-zero if
      # its own invariants fail, so this gates those too.
      - name: Replay a coherent order flow and compare the books
        run: |
          set -euo pipefail
          opam exec -- ./_build/default/test/gen_corpus.exe -book /tmp/flow.itch50 20000
          opam exec -- ./_build/default/bin/itch.exe book /tmp/flow.itch50 -tops > /tmp/book_ml.txt
          sed -n '1,5p' /tmp/book_ml.txt
          python3 test/cross_check_book.py /tmp/flow.itch50 --expect /tmp/book_ml.txt

      # Spec 4.4.5: a replace does not repeat the side, so it has to be carried
      # forward from the order being replaced. Dropping that is the canonical way
      # to get a wrong book that still balances, so it is what this perturbs.
      - name: Prove the book cross-check can fail
        run: |
          set -euo pipefail
          cp test/cross_check_book.py /tmp/cross_check_book.orig
          sed -i 's|orders\[new_ref\] = (locate_, side_, price, shares)|orders[new_ref] = (locate_, "B", price, shares)|' test/cross_check_book.py
          if python3 test/cross_check_book.py /tmp/flow.itch50 --expect /tmp/book_ml.txt; then
            cp /tmp/cross_check_book.orig test/cross_check_book.py
            echo "FAIL: the book cross-check agreed with a replace that drops the side"
            exit 1
          fi
          cp /tmp/cross_check_book.orig test/cross_check_book.py
          echo "OK: the book cross-check reported the injected divergence"

      # Level 4's lifetime analysis is a third consumer of the same stream, and
      # it can be wrong in ways the book cannot detect: the book does not record
      # when an order arrived, so every price level can be right while every
      # lifetime is wrong. It runs on the coherent flow rather than the
      # aggregate corpus because an orphaned modify never contributes a lifetime
      # at all, and a corpus of orphans would check nothing.
      - name: Compare the order-lifetime analysis against an independent implementation
        run: |
          set -euo pipefail
          opam exec -- ./_build/default/bin/itch.exe analyze /tmp/flow.itch50 -capacity-log2 18 -aggregate | head -1 > /tmp/life_ml.txt
          cat /tmp/life_ml.txt
          python3 test/cross_check_lifetime.py /tmp/flow.itch50 --expect /tmp/life_ml.txt

      # A partial cancel is not a death -- the order rests on with fewer shares
      # -- so reading the share count as a new total rather than a delta to
      # subtract silently moves orders between terminal causes and shifts every
      # lifetime, without raising anywhere. That is the same class of mistake the
      # order book already made once, and it is what this perturbs.
      - name: Prove the lifetime cross-check can fail
        run: |
          set -euo pipefail
          cp test/cross_check_lifetime.py /tmp/cross_check_lifetime.orig
          sed -i 's|        remaining = entry\[1\] - shares|        remaining = shares|' test/cross_check_lifetime.py
          if ! git diff --quiet test/cross_check_lifetime.py; then
            echo "perturbation applied"
          else
            cp /tmp/cross_check_lifetime.orig test/cross_check_lifetime.py
            echo "FAIL: the perturbation matched nothing -- cross_check_lifetime.py has moved"
            exit 1
          fi
          if python3 test/cross_check_lifetime.py /tmp/flow.itch50 --expect /tmp/life_ml.txt; then
            cp /tmp/cross_check_lifetime.orig test/cross_check_lifetime.py
            echo "FAIL: the lifetime cross-check agreed with a wrong share arithmetic"
            exit 1
          fi
          cp /tmp/cross_check_lifetime.orig test/cross_check_lifetime.py
          echo "OK: the lifetime cross-check reported the injected divergence"

      # The round trip has the widest reach of any check here -- 20,000 generated
      # messages a run, at field values no hand-written vector would think of --
      # and "it is checked for teeth" was a thing someone did once and wrote
      # down, never reproduced. Shift the encoder's share field by one byte and
      # require a counterexample. Last in the job: it perturbs the tree and the
      # build, and restores both.
      - name: Prove the round trip can fail
        run: |
          set -euo pipefail
          cp lib/itch/encoder.ml /tmp/encoder.orig
          sed -i 's|Bigstring.set_uint32_be_exn buf ~pos:(pos + 20) (Shares.to_int m.shares);|Bigstring.set_uint32_be_exn buf ~pos:(pos + 21) (Shares.to_int m.shares);|' lib/itch/encoder.ml
          if ! git diff --quiet lib/itch/encoder.ml; then
            echo "perturbation applied"
          else
            echo "FAIL: the perturbation matched nothing -- encoder.ml has moved"
            exit 1
          fi
          if opam exec -- dune runtest >/dev/null 2>&1; then
            cp /tmp/encoder.orig lib/itch/encoder.ml
            echo "FAIL: the round trip passed with a one-byte offset error in the encoder"
            exit 1
          fi
          cp /tmp/encoder.orig lib/itch/encoder.ml
          echo "OK: the round trip produced a counterexample"

  # The [@@zero_alloc] contract on Handler.S is the strongest claim this project
  # makes, and it is only checked by OxCaml, and only under --profile release
  # (dune's dev profile passes -opaque, which withholds the cross-module
  # information the checker needs). Without this job the claim is unenforced.
  #
  # Building the OxCaml compiler from source is slow: it ran green from the
  # Actions tab on 2026-08-22 in 23m24s, on 2e4290f, and that is why it now
  # gates main rather than waiting to be asked. It is skipped on pull requests
  # only because twenty-odd minutes is too long to sit in front of a review; a
  # merge to main runs it.
  oxcaml-zero-alloc:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up opam
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Create the OxCaml switch
        run: |
          set -euo pipefail
          opam repository add ox git+https://github.com/oxcaml/opam-repository.git --all-switches --set-default
          opam switch create ox --repos ox,default --packages ocaml-variants.5.2.0+ox
          opam install --switch=ox core core_unix base_bigstring ppx_jane base_quickcheck -y

      - name: Build with --profile release (this is what checks [@zero_alloc])
        run: opam exec --switch=ox -- dune build --profile release

      - name: Prove the checker is live
        run: |
          set -euo pipefail
          # An annotation that only ever passes proves nothing. padded_string
          # builds a string, so [@zero_alloc] on it MUST be rejected.
          cp lib/itch/wire.ml /tmp/wire.orig
          sed -i 's/^let padded_string buf ~pos ~len =/let[@zero_alloc] padded_string buf ~pos ~len =/' lib/itch/wire.ml
          if opam exec --switch=ox -- dune build --profile release --build-dir=_build-probe 2>/dev/null; then
            cp /tmp/wire.orig lib/itch/wire.ml
            echo "FAIL: [@zero_alloc] accepted a function that allocates -- the checker is not running"
            exit 1
          fi
          cp /tmp/wire.orig lib/itch/wire.ml
          echo "OK: the checker rejected a genuinely allocating function"

      - name: Test on OxCaml
        run: |
          set -euo pipefail
          # dune runtest cannot be used here: ppx_expect v0.18~preview resolves
          # the corrected-file path with Filename.basename, so any expect test in
          # a subdirectory crashes the runner even when every test passes.
          opam exec --switch=ox -- dune build --profile release @check || true
          # Build the runner as an explicit target rather than relying on it
          # being a side effect of the `dune runtest` above, which crashes. A
          # runner that is stale or missing does not fail the loop below -- it
          # reports "0 tests ran" and exits 0, which is a green tick for having
          # run nothing. That happened locally: `dune build @all` left an hours
          # old runner in place and three new test files reported 0 tests each.
          opam exec --switch=ox -- dune build --profile release \
            test/.itch_tests.inline-tests/inline-test-runner.exe
          opam exec --switch=ox -- dune runtest --profile release > /dev/null 2>&1 || true
          cd _build/default/test
          for p in test_parser test_order_book test_differential test_roundtrip test_zero_alloc \
                   test_order_table test_histogram test_analysis; do
            out=$(./.itch_tests.inline-tests/inline-test-runner.exe inline-test-runner itch_tests \
              -partition "$p.ml" -source-tree-root . -diff-cmd - -show-counts 2>&1)
            echo "$p: $out"
            # A partition that ran nothing is not a pass.
            case "$out" in
              "0 tests ran"*)
                echo "FAIL: $p registered no tests -- the runner is stale or the partition was renamed"
                exit 1
                ;;
            esac
          done
